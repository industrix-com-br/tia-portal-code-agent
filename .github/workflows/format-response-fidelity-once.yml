name: Format response fidelity branch once

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    if: github.head_ref == 'agent/response-fidelity-deployment-diagnostics'
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4

      - name: Restore solution
        id: restore
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet restore TiaAgent.sln --locked-mode --verbosity normal 2>&1 | Tee-Object -FilePath restore.log
          exit $LASTEXITCODE

      - name: Publish restore failure
        if: steps.restore.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $log = (Get-Content -LiteralPath restore.log | Select-Object -Last 120) -join [Environment]::NewLine
          @(
            'Restore diagnostic tail from temporary workflow:',
            '',
            '~~~text',
            $log,
            '~~~'
          ) | Set-Content -LiteralPath restore-comment.md -Encoding UTF8
          gh pr comment $env:PR_NUMBER --body-file restore-comment.md
          exit 1

      - name: Apply repository formatting
        if: steps.restore.outcome == 'success'
        shell: pwsh
        run: dotnet format TiaAgent.sln --no-restore

      - name: Commit formatting changes
        if: steps.restore.outcome == 'success'
        shell: pwsh
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "style: apply dotnet format"
            git push origin "HEAD:$env:HEAD_BRANCH"
          } else {
            Write-Host "No formatting changes were required."
          }
