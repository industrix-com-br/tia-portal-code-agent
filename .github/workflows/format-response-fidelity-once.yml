name: Format response fidelity branch once

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/response-fidelity-deployment-diagnostics'
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4

      - name: Apply repository formatting
        shell: pwsh
        run: dotnet format TiaAgent.sln

      - name: Commit formatting changes
        shell: pwsh
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "style: apply dotnet format"
            git push origin "HEAD:$env:HEAD_BRANCH"
          } else {
            Write-Host "No formatting changes were required."
          }
