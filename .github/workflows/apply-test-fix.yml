name: Apply test cleanup

on:
  push:
    branches:
      - agent/unified-versioning-pipeline

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-versioning-pipeline
          fetch-depth: 0
      - name: Remove platform-dependent demonstration tests
        shell: pwsh
        run: |
          git apply --whitespace=nowarn .github/test-fix.patch
          Remove-Item .github/test-fix.patch -Force
          Remove-Item .github/workflows/apply-test-fix.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: remove platform-dependent encoding demonstrations"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
