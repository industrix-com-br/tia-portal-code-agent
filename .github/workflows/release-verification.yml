name: Release Verification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-verification.yml
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  verify:
    if: github.event_name == 'push' || github.event.pull_request.number == 178
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify v0.3.1 publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.3.1
          VERSION: 0.3.1
          TARGET_SHA: 216f7e9f226efdbb0f64c86aecdb623af3d1b84b
          REPORT_PR: 173
        run: |
          set -euo pipefail

          package_name="TiaAgent.Cli.${VERSION}.nupkg"
          addin_name="TiaAgent-${VERSION}.addin"
          nuget_url="https://api.nuget.org/v3-flatcontainer/tiaagent.cli/${VERSION}/tiaagent.cli.${VERSION}.nupkg"
          nuget_page="https://www.nuget.org/packages/TiaAgent.Cli/${VERSION}"

          recent_runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=20")"
          run_snapshot="$(jq -r '
            [.workflow_runs[] | select(.name == "Pipeline" or .name == "Release Verification")][0:12]
            | map("- [\(.name) #\(.run_number)](\(.html_url)): event=\(.event), status=\(.status), conclusion=\(.conclusion // "pending"), created=\(.created_at)")
            | join("\n")
          ' <<< "$recent_runs")"
          gh pr comment "$REPORT_PR" --repo "$GITHUB_REPOSITORY" --body "## ${TAG} workflow snapshot

${run_snapshot}"

          release_json=""
          verified=false
          for attempt in $(seq 1 80); do
            if release_json="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>/dev/null)"; then
              release_ok="$(jq -r --arg tag "$TAG" --arg package "$package_name" --arg addin "$addin_name" '
                (.tag_name == $tag)
                and (.draft == false)
                and (.prerelease == false)
                and ([.assets[].name] | index($package) != null)
                and ([.assets[].name] | index($addin) != null)
              ' <<< "$release_json")"

              if [[ "$release_ok" == "true" ]] && curl --fail --silent --show-error --location --range 0-0 "$nuget_url" -o /dev/null; then
                verified=true
                break
              fi
            fi

            echo "Release not fully available yet (attempt $attempt/80)."
            sleep 15
          done

          if [[ "$verified" != "true" ]]; then
            gh pr comment "$REPORT_PR" --repo "$GITHUB_REPOSITORY" --body "Release verification for ${TAG} timed out before the GitHub Release assets and NuGet package were both available."
            exit 1
          fi

          release_url="$(jq -r '.html_url' <<< "$release_json")"
          published_at="$(jq -r '.published_at' <<< "$release_json")"

          runs_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?event=workflow_dispatch&per_page=50")"
          pipeline_record="$(jq -r --arg published "$published_at" '
            [.workflow_runs[]
              | select(.name == "Pipeline")
              | select(.status == "completed" and .conclusion == "success")
              | select(.created_at <= $published and .updated_at >= $published)]
            | sort_by(.created_at)
            | last
            | if . then [.id, .html_url] | @tsv else empty end
          ' <<< "$runs_json")"

          if [[ -z "$pipeline_record" ]]; then
            gh pr comment "$REPORT_PR" --repo "$GITHUB_REPOSITORY" --body "Release verification found ${TAG}, its expected assets, and NuGet publication, but could not correlate a successful official Pipeline run."
            exit 1
          fi

          IFS=$'\t' read -r pipeline_id pipeline_url <<< "$pipeline_record"
          report="$(cat <<EOF
          ## ${TAG} release verification

          - Pipeline: [run ${pipeline_id}](${pipeline_url}) — success
          - GitHub Release: [${TAG}](${release_url}) — published, stable
          - NuGet: [TiaAgent.Cli ${VERSION}](${nuget_page}) — available
          - Assets: \`${package_name}\`, \`${addin_name}\`
          - Tagged commit: \`${TARGET_SHA}\`
          EOF
          )"

          gh pr comment "$REPORT_PR" --repo "$GITHUB_REPOSITORY" --body "$report"

          echo "Pipeline run: $pipeline_id $pipeline_url"
          echo "GitHub Release: $release_url"
          echo "NuGet package: $nuget_page"
          echo "Assets: $package_name, $addin_name"

      - name: Remove temporary trigger branches
        if: always()
        shell: bash
        run: |
          git push origin --delete release-bootstrap/v0.3.1 || true
          git push origin --delete release-verify/v0.3.1 || true
