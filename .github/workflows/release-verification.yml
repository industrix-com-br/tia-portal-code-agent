name: Release Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  verify-release:
    if: github.head_ref == 'release-verify/v0.3.0'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify v0.3.0 publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="v0.3.0"
          version="0.3.0"
          repo="$GITHUB_REPOSITORY"

          run_json=$(gh run list \
            --repo "$repo" \
            --workflow pipeline.yml \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId,status,conclusion,url)
          echo "$run_json"

          run_id=$(jq -r '.[0].databaseId // empty' <<< "$run_json")
          run_status=$(jq -r '.[0].status // empty' <<< "$run_json")
          run_conclusion=$(jq -r '.[0].conclusion // empty' <<< "$run_json")
          run_url=$(jq -r '.[0].url // empty' <<< "$run_json")

          if [[ -z "$run_id" ]]; then
            echo "No workflow_dispatch Pipeline run was found." >&2
            exit 1
          fi

          if [[ "$run_status" != "completed" || "$run_conclusion" != "success" ]]; then
            echo "Release pipeline is not successful: status=$run_status conclusion=$run_conclusion url=$run_url" >&2
            exit 1
          fi

          release_json=$(gh release view "$tag" --repo "$repo" --json url,assets)
          echo "$release_json"

          release_url=$(jq -r '.url' <<< "$release_json")
          assets_json=$(jq '[.assets[].name]' <<< "$release_json")
          assets=$(jq -r 'join(", ")' <<< "$assets_json")

          expected_package="TiaAgent.Cli.$version.nupkg"
          expected_addin="TiaAgent-$version.addin"
          if ! jq -e --arg package "$expected_package" --arg addin "$expected_addin" \
            'index($package) != null and index($addin) != null' <<< "$assets_json" >/dev/null; then
            echo "Expected release assets are missing. Found: $assets" >&2
            exit 1
          fi

          package_url="https://api.nuget.org/v3-flatcontainer/tiaagent.cli/$version/tiaagent.cli.$version.nupkg"
          curl --fail --silent --show-error --output /dev/null "$package_url"

          cat <<EOF | tee -a "$GITHUB_STEP_SUMMARY"
          ## Release verification succeeded

          - Version: $version
          - Tag: $tag
          - Pipeline: $run_url
          - GitHub Release: $release_url
          - Release assets: $assets
          - NuGet package endpoint: HTTP 200
          EOF
