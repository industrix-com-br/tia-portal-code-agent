name: Diagnose Response Center

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        shell: pwsh
        run: dotnet restore TiaAgent.sln --locked-mode
      - name: Build with concise failure output
        id: build
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "response-center-build.log"
          $report = Join-Path $env:RUNNER_TEMP "response-center-errors.md"
          & dotnet build TiaAgent.sln --configuration Release --no-restore --verbosity minimal *> $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $errors = @(Get-Content $log |
              Select-String -Pattern 'error (CS|MSB|NETSDK|NU|XLS|MC)[0-9]+|Build FAILED|error :' |
              Select-Object -Last 80 |
              ForEach-Object { $_.Line })

            @(
              "## Response Center diagnostic build",
              "",
              '```text',
              $errors,
              '```'
            ) | Set-Content -Path $report -Encoding utf8

            $errors | ForEach-Object { Write-Host $_ }
            throw "Build failed with exit code $exitCode."
          }
          Get-Content $log | Select-Object -Last 20
      - name: Publish diagnostic to PR
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file "$env:RUNNER_TEMP\response-center-errors.md"
