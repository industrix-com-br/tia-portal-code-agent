name: Temporary code scanning classification

on:
  push:
    branches:
      - automation/code-scanning-audit-20260802
    paths:
      - .github/workflows/temporary-code-scanning-classify.yml

permissions:
  contents: write
  security-events: read

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify open code scanning alerts
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_BRANCH: automation/code-scanning-audit-20260802
        shell: bash
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          git fetch origin main --quiet
          main_sha="$(git rev-parse origin/main)"

          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$repo/code-scanning/alerts?state=open&per_page=100" \
            | jq -s 'add // []' > open-alerts.json

          total="$(jq 'length' open-alerts.json)"
          : > missing.tsv
          : > non_main.tsv

          jq -c '.[]' open-alerts.json | while IFS= read -r alert; do
            number="$(jq -r '.number' <<<"$alert")"
            state="$(jq -r '.state // "unknown"' <<<"$alert")"
            rule="$(jq -r '.rule.id // "unknown"' <<<"$alert")"
            severity="$(jq -r '.rule.security_severity_level // .rule.severity // "unknown"' <<<"$alert")"
            ref="$(jq -r '.most_recent_instance.ref // "unknown"' <<<"$alert")"
            path="$(jq -r '.most_recent_instance.location.path // ""' <<<"$alert")"
            line="$(jq -r '.most_recent_instance.location.start_line // 0' <<<"$alert")"
            message="$(jq -r '.most_recent_instance.message.text // ""' <<<"$alert" | tr '\t\r\n' '   ')"

            exists=true
            if [ -z "$path" ] || ! git cat-file -e "origin/main:$path" 2>/dev/null; then
              exists=false
              printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$number" "$state" "$severity" "$rule" "$ref" "$path:$line" "$message" >> missing.tsv
            fi

            if [ "$ref" != "refs/heads/main" ]; then
              printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$number" "$state" "$severity" "$rule" "$ref" "$path:$line" "$exists" "$message" >> non_main.tsv
            fi
          done

          missing_count="$(wc -l < missing.tsv | tr -d ' ')"
          non_main_count="$(wc -l < non_main.tsv | tr -d ' ')"
          report="$GITHUB_WORKSPACE/code-scanning-classification.md"

          {
            echo '# Code scanning classification'
            echo
            echo "- Main commit: \`$main_sha\`"
            echo "- Open alerts: **$total**"
            echo "- Alerts whose referenced path is absent from current main: **$missing_count**"
            echo "- Alerts whose most recent instance is not on main: **$non_main_count**"
            echo
            echo '## Counts by severity'
            echo
            echo '| Severity | Count |'
            echo '|---|---:|'
            jq -r 'group_by(.rule.security_severity_level // .rule.severity // "unknown")[] | "| \(.[0].rule.security_severity_level // .[0].rule.severity // "unknown") | \(length) |"' open-alerts.json
            echo
            echo '## Counts by rule'
            echo
            echo '| Rule | Count |'
            echo '|---|---:|'
            jq -r 'group_by(.rule.id // "unknown") | sort_by(length) | reverse[] | "| `\(.[0].rule.id // "unknown")` | \(length) |"' open-alerts.json
            echo
            echo '## Alerts referencing paths absent from main'
            echo
            if [ "$missing_count" -eq 0 ]; then
              echo 'None.'
            else
              echo '| Alert | State | Severity | Rule | Most recent ref | Location | Message |'
              echo '|---:|---|---|---|---|---|---|'
              while IFS=$'\t' read -r number state severity rule ref location message; do
                printf '| #%s | %s | %s | `%s` | `%s` | `%s` | %s |\n' "$number" "$state" "$severity" "$rule" "$ref" "$location" "$message"
              done < missing.tsv
            fi
            echo
            echo '## Alerts whose most recent instance is not on main'
            echo
            if [ "$non_main_count" -eq 0 ]; then
              echo 'None.'
            else
              echo '| Alert | State | Severity | Rule | Ref | Location | Path exists on main | Message |'
              echo '|---:|---|---|---|---|---|---|---|'
              while IFS=$'\t' read -r number state severity rule ref location exists message; do
                printf '| #%s | %s | %s | `%s` | `%s` | `%s` | %s | %s |\n' "$number" "$state" "$severity" "$rule" "$ref" "$location" "$exists" "$message"
              done < non_main.tsv
            fi
          } > "$report"

          rm -f open-alerts.json missing.tsv non_main.tsv
          git pull --rebase origin "$AUDIT_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code-scanning-classification.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: classify temporary code scanning alerts'
          git push origin "HEAD:$AUDIT_BRANCH"
