name: Release Recovery Bootstrap

on:
  create:

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  create-and-dispatch:
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release-recovery/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create tag and dispatch release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_BRANCH: ${{ github.event.ref }}
          TARGET_SHA: 48fb337c0ffb3acdad12ec677812c720e6d3a3b0
        run: |
          set -euo pipefail

          tag="${TRIGGER_BRANCH#release-recovery/}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then
            echo "Invalid release tag derived from trigger branch: $tag" >&2
            exit 1
          fi

          git fetch origin main --tags
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "Target commit is not contained in main: $TARGET_SHA" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$TARGET_SHA" -m "Release $tag"
          git push origin "refs/tags/$tag"

          gh workflow run pipeline.yml --ref main -f release_tag="$tag"
          git push origin --delete "$TRIGGER_BRANCH"

          echo "Created $tag and dispatched pipeline.yml via workflow_dispatch."

  verify-release:
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release-status/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Verify workflow, release, and NuGet publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_BRANCH: ${{ github.event.ref }}
          REPORT_PR: "157"
        run: |
          set -euo pipefail

          tag="${TRIGGER_BRANCH#release-status/}"
          version="${tag#v}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then
            echo "Invalid release tag derived from status branch: $tag" >&2
            exit 1
          fi

          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh run list \
              --workflow pipeline.yml \
              --event workflow_dispatch \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 10
          done

          if [[ -z "$run_id" ]]; then
            gh pr comment "$REPORT_PR" --body "Release verification failed: no workflow_dispatch run was found for $tag."
            exit 1
          fi

          set +e
          gh run watch "$run_id" --exit-status
          run_exit=$?
          set -e

          run_url=$(gh run view "$run_id" --json url --jq '.url')
          gh run view "$run_id" --log > release-run.log

          if ! grep -Fq "$tag" release-run.log; then
            gh pr comment "$REPORT_PR" --body "Release verification failed: latest workflow_dispatch run $run_url was not for $tag."
            exit 1
          fi

          if [[ "$run_exit" -ne 0 ]]; then
            gh pr comment "$REPORT_PR" --body "Release verification failed: Pipeline run $run_url completed unsuccessfully for $tag."
            exit "$run_exit"
          fi

          release_url=$(gh release view "$tag" --json url --jq '.url')
          assets=$(gh release view "$tag" --json assets --jq '[.assets[].name] | join(", ")')

          package_url="https://api.nuget.org/v3-flatcontainer/tiaagent.cli/$version/tiaagent.cli.$version.nupkg"
          package_status=""
          for _ in $(seq 1 30); do
            package_status=$(curl -sS -o /dev/null -w '%{http_code}' "$package_url")
            if [[ "$package_status" == "200" ]]; then
              break
            fi
            sleep 10
          done

          if [[ "$package_status" != "200" ]]; then
            gh pr comment "$REPORT_PR" --body "Release verification failed: Pipeline succeeded at $run_url and GitHub Release exists at $release_url, but NuGet returned HTTP $package_status for $tag."
            exit 1
          fi

          cat > release-report.md <<EOF
          Release verification succeeded for **$tag**.

          - Pipeline: $run_url
          - GitHub Release: $release_url
          - Release assets: $assets
          - NuGet package endpoint: HTTP 200
          EOF

          gh pr comment "$REPORT_PR" --body-file release-report.md
          git push origin --delete "$TRIGGER_BRANCH"
