name: Temporary code scanning cleanup

on:
  push:
    branches:
      - automation/code-scanning-audit-20260802
    paths:
      - .github/workflows/temporary-code-scanning-audit.yml

permissions:
  contents: write
  security-events: write

jobs:
  dismiss-stale-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dismiss verified stale alerts and commit report
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_BRANCH: automation/code-scanning-audit-20260802
        shell: bash
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          expected_path="src/TiaAgent.OpenCode/Client/OpenCodeHttpClient.cs"
          expected_alerts=(7 8 9)
          dismissal_comment="Stale CodeQL alert: the referenced file was deleted in commit ec4fed9 and is absent from main. PR #190 verified that this finding no longer applies."

          git fetch origin main --quiet
          main_sha="$(git rev-parse origin/main)"

          if git cat-file -e "origin/main:$expected_path" 2>/dev/null; then
            echo "::error::$expected_path exists on main; refusing to dismiss alerts."
            exit 1
          fi

          report="$GITHUB_WORKSPACE/code-scanning-dismissal-report.md"
          {
            echo '<!-- code-scanning-dismissal-20260802 -->'
            echo '# Code scanning dismissal report'
            echo
            echo "- Main commit verified: \`$main_sha\`"
            echo "- Expected stale path: \`$expected_path\`"
            echo "- File exists on main: **no**"
            echo
            echo '| Alert | Previous state | Path | Action | Final state | Dismissal reason |'
            echo '|---:|---|---|---|---|---|'
          } > "$report"

          for number in "${expected_alerts[@]}"; do
            alert="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$repo/code-scanning/alerts/$number")"

            previous_state="$(jq -r '.state // "unknown"' <<<"$alert")"
            alert_path="$(jq -r '.most_recent_instance.location.path // ""' <<<"$alert")"
            action="none"

            if [ "$alert_path" != "$expected_path" ]; then
              echo "::error::Alert #$number path '$alert_path' does not match expected stale path '$expected_path'."
              echo "| #$number | $previous_state | \`$alert_path\` | refused: path mismatch | $previous_state |  |" >> "$report"
              continue
            fi

            if [ "$previous_state" = "open" ]; then
              gh api --method PATCH \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/$repo/code-scanning/alerts/$number" \
                -f state='dismissed' \
                -f dismissed_reason='false positive' \
                -f dismissed_comment="$dismissal_comment" \
                >/dev/null
              action="dismissed as stale"
            else
              action="no change required"
            fi

            final_alert="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$repo/code-scanning/alerts/$number")"
            final_state="$(jq -r '.state // "unknown"' <<<"$final_alert")"
            final_reason="$(jq -r '.dismissed_reason // ""' <<<"$final_alert")"

            echo "| #$number | $previous_state | \`$alert_path\` | $action | $final_state | $final_reason |" >> "$report"
          done

          echo >> "$report"
          echo "Dismissal comment: $dismissal_comment" >> "$report"

          git pull --rebase origin "$AUDIT_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code-scanning-dismissal-report.md
          if git diff --cached --quiet; then
            echo 'Dismissal report is unchanged.'
            exit 0
          fi
          git commit -m 'chore: record temporary code scanning dismissals'
          git push origin "HEAD:$AUDIT_BRANCH"
