name: Cleanup release trigger

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove temporary release branch
    if: github.head_ref == 'release/v0.3.0-beta.7-trigger'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Delete temporary branch
        run: git push origin --delete release/v0.3.0-beta.7-trigger
