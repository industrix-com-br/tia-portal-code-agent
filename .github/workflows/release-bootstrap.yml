name: Release Bootstrap

on:
  create:

permissions:
  contents: write
  actions: write

jobs:
  create-and-dispatch:
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release-bootstrap/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate, create tag, and dispatch release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_BRANCH: ${{ github.event.ref }}
          TARGET_SHA: 216f7e9f226efdbb0f64c86aecdb623af3d1b84b
        run: |
          set -euo pipefail

          tag="${TRIGGER_BRANCH#release-bootstrap/}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-((alpha|beta|rc)\.[0-9]+))?$ ]]; then
            echo "Invalid release tag derived from trigger branch: $tag" >&2
            exit 1
          fi

          version="${tag#v}"
          git fetch origin main --tags

          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "Target commit is not contained in main: $TARGET_SHA" >&2
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi

          if gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/$tag" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $tag" >&2
            exit 1
          fi

          echo "Waiting for successful Pipeline CI on $TARGET_SHA..."
          ci_verified=false
          for attempt in $(seq 1 40); do
            response="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=100")"
            record="$(jq -r --arg sha "$TARGET_SHA" '
              [.workflow_runs[] | select(.name == "Pipeline" and .head_sha == $sha)]
              | sort_by(.created_at)
              | last
              | if . then [.status, (.conclusion // ""), .html_url] | @tsv else empty end
            ' <<< "$response")"

            if [[ -n "$record" ]]; then
              IFS=$'\t' read -r status conclusion ci_url <<< "$record"
              echo "CI status: $status ${conclusion:-pending} ($ci_url)"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  echo "Target CI did not succeed: $conclusion" >&2
                  exit 1
                fi
                ci_verified=true
                break
              fi
            else
              echo "No CI run found yet for $TARGET_SHA."
            fi

            sleep 15
          done

          if [[ "$ci_verified" != "true" ]]; then
            echo "Timed out waiting for successful CI on $TARGET_SHA." >&2
            exit 1
          fi

          nuget_index="$(curl --fail --silent --show-error https://api.nuget.org/v3-flatcontainer/tiaagent.cli/index.json)"
          if jq -e --arg version "$version" '.versions | any(. == $version)' <<< "$nuget_index" >/dev/null; then
            echo "NuGet version already exists: TiaAgent.Cli $version" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$TARGET_SHA" -m "Release $tag"
          git push origin "refs/tags/$tag"

          gh workflow run pipeline.yml --ref main -f release_tag="$tag"
          git push origin --delete "$TRIGGER_BRANCH"

          echo "Created $tag at $TARGET_SHA and dispatched pipeline.yml."
